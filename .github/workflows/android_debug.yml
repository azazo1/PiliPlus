name: Debug APK

# 调试构建: 推送 dsh/** 分支或手动触发时, 构建带调试探针的 debug APK 并上传 artifact.
# 与正式 Build workflow 分开, 不拖慢正常发版.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的 ref, 留空则构建当前分支"
        required: false
        default: ""
        type: string
  push:
    branches:
      - "dsh/**"

jobs:
  debug-apk:
    name: Debug APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: 代码迁出
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: 构建Java环境
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: android
          gradle-home-cache-cleanup: true

      - name: 安装Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Flutter Build Debug Apk
        run: flutter build apk --debug --target-platform android-arm64 --dart-define=probe.scanLogin=true --no-pub

      - name: 上传
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: PiliPlus_debug_scan_login_arm64
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
