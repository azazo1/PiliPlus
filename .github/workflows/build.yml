name: Build

on:
    push:
        paths-ignore:
            - "**.md"
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review
        paths-ignore:
            - "**.md"
    workflow_dispatch:
        inputs:
            build_android:
                description: "Build Android"
                required: false
                default: true
                type: boolean

            build_ios:
                description: "Build iOS"
                required: false
                default: true
                type: boolean

            build_mac:
                description: "Build Mac"
                required: false
                default: true
                type: boolean

            build_win_x64:
                description: "Build Win-x64"
                required: false
                default: true
                type: boolean

            build_linux_x64:
                description: "Build Linux-x64"
                required: false
                default: true
                type: boolean

            tag:
                description: "tag"
                required: false
                default: ""
                type: string

jobs:
    android:
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.repository == 'bggRGjQaUbCoE/PiliPlus') || github.event.inputs.build_android == 'true' }}
        name: Release Android
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: 代码迁出
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6
              with:
                  build-root-directory: android
                  cache-read-only: ${{ github.event_name == 'pull_request' }}
                  gradle-home-cache-cleanup: true
                  add-job-summary: "on-failure"

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Write key
              run: |
                  if [ ! -z "${{ secrets.SIGN_KEYSTORE_BASE64 }}" ]; then
                    echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
                    echo storeFile='key.jks' >> android/key.properties
                    echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> android/key.properties
                    echo keyAlias='${{ secrets.KEY_ALIAS }}' >> android/key.properties
                    echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> android/key.properties
                  fi

            - name: Set and Extract version
              if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
              shell: pwsh
              run: lib/scripts/build.ps1 android

            - name: Resolve Dart dependencies
              run: flutter pub get

            - name: Patch media_kit overlay wid
              # todo remove 小窗 spike: 让 AndroidVideoController 在小窗期间不要把 wid 抢回 Flutter 纹理
              run: python3 lib/scripts/patch_media_kit_overlay_wid.py

            - name: Flutter Build Release Apk
              if: false # todo remove 小窗 spike: 临时跳过正式包, 避免安装时覆盖正式应用
              env:
                  FULL_ANDROID_ABIS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              run: |
                  if [ "$FULL_ANDROID_ABIS" = "true" ]; then
                    flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --no-pub
                  else
                    flutter build apk --release --split-per-abi --target-platform android-arm64 --dart-define-from-file=pili_release.json --no-pub
                  fi

            - name: Flutter Build Debug Apk
              # todo remove 小窗 spike: 临时 push 构建 debug 包 (包名带 .debug 后缀, 不覆盖正式包和 .dev)
              run: flutter build apk --debug --split-per-abi --target-platform android-arm64 --no-pub

            - name: Rename
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-debug.apk; do
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-debug\.apk|\1|')
                    mv "$file" "PiliPlus_android_${{ env.version }}_${abi}.apk"
                  done
              shell: bash

            - name: Release
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event.inputs.tag }}
                  name: ${{ github.event.inputs.tag }}
                  files: PiliPlus_android_*.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_arm64-v8a
                  path: PiliPlus_android_*_arm64-v8a.apk

            - name: 上传
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_armeabi-v7a
                  path: PiliPlus_android_*_armeabi-v7a.apk

            - name: 上传
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_x86_64
                  path: PiliPlus_android_*_x86_64.apk

    ios:
        if: false # todo remove 小窗 spike: 临时只构建 android
        uses: ./.github/workflows/ios.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    mac:
        if: false # todo remove 小窗 spike: 临时只构建 android
        uses: ./.github/workflows/mac.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    win_x64:
        if: false # todo remove 小窗 spike: 临时只构建 android
        uses: ./.github/workflows/win_x64.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    linux_x64:
        if: false # todo remove 小窗 spike: 临时只构建 android
        uses: ./.github/workflows/linux_x64.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
